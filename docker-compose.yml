services:
  # 1. Backend Django
  backend:
    build: .
    container_name: norte_tech_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:      # <--- ADICIONADO
      - norte-network

  # 2. WPPConnect Server
  wppconnect:
    build: ./wppconnect-server
    container_name: norte_tech_wpp
    ports:
      - "21465:21465"
    environment:
      - HOST=0.0.0.0
      - PORT=21465
      # Força o Puppeteer a usar o Chromium que instalamos no Debian
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      - ./wpp_sessions:/home/wppconnect/sessions
    networks:      # <--- ADICIONADO
      - norte-network

  # 3. Banco de Dados
  postgres:
    image: postgres:18-alpine
    container_name: norte_tech_postgres
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:      # <--- ADICIONADO
      - norte-network

  # 4. Redis
  redis:
    image: redis:7.2-alpine
    container_name: norte_tech_redis
    command: redis-server --appendonly yes --protected-mode no --bind 0.0.0.0
    volumes:
      - redis_data:/data
    networks:      # <--- ADICIONADO
      - norte-network

# Definição da Rede
networks:
  norte-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: